<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resale Scout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .photoButton {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border-radius: 10px;
      background: #eeeeee;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #photo {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      margin-top: 20px;
      border-radius: 10px;
    }

    #analyzeButton {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #analyzeButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    #results {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #eef7ff;
      border-radius: 12px;
     white-space: normal;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔎 Resale Scout</h1>

  <div class="subtitle">
    Snap it. Scout it. Sell it.
  </div>

  <div class="card">

    <h2>Find items worth reselling</h2>

    <p>
      Take a picture of an item, thrift-store shelf, or garage-sale table
      and let Resale Scout analyze it for resale potential.
    </p>

  <button
  type="button"
  class="photoButton"
  onclick="document.getElementById('cameraPhoto').click()"
>
  📷 Take a Picture
</button>

<input
  id="cameraPhoto"
  type="file"
  accept="image/*"
  onchange="handlePhoto(this.files[0])"
  capture="environment"
  style="display:none"
>

<button
  type="button"
  class="photoButton"
  onclick="document.getElementById('libraryPhoto').click()"
>
  🖼️ Choose a Photo
</button>

<input
  id="libraryPhoto"
  type="file"
  accept="image/*"
  onchange="handlePhoto(this.files[0])"
  style="display:none"
>

    <img id="preview" alt="Selected photo">

    <button id="barcodeButton" type="button" class="photoButton">
  📦 Scan Barcode
</button>

<div id="barcodeBox" style="display:none; margin-top:12px;">
  <input
    id="barcodeInput"
    type="text"
    inputmode="numeric"
    placeholder="Enter or scan UPC barcode"
    style="
      width:100%;
      box-sizing:border-box;
      padding:14px;
      font-size:18px;
      border:1px solid #ccc;
      border-radius:10px;
      margin-bottom:10px;
    "
  >

  <button id="barcodeSearchButton" type="button" class="photoButton">
    🔎 Look Up Barcode
  </button>
</div>

    <button id="analyzeButton" type="button">
      Analyze for Resale
    </button>

    <div id="status"></div>

    <div id="results"></div>

  </div>

</div>

<script>
const cameraPhoto = document.getElementById("cameraPhoto");
const libraryPhoto = document.getElementById("libraryPhoto");
const preview = document.getElementById("preview");
const analyzeButton = document.getElementById("analyzeButton");
const statusBox = document.getElementById("status");
const resultsBox = document.getElementById("results");
  const barcodeButton = document.getElementById("barcodeButton");
const barcodeBox = document.getElementById("barcodeBox");
const barcodeInput = document.getElementById("barcodeInput");
const barcodeSearchButton = document.getElementById("barcodeSearchButton");
  
barcodeButton.addEventListener("click", async function () {
  barcodeBox.style.display = "block";

  if (!("BarcodeDetector" in window)) {
    statusBox.textContent =
      "Barcode camera scanning is not supported on this browser. Enter the UPC manually.";
    barcodeInput.focus();
    return;
  }

  try {
    statusBox.textContent = "📷 Point camera at barcode...";

    let video = document.getElementById("barcodeVideo");

    if (!video) {
      video = document.createElement("video");
      video.id = "barcodeVideo";
      video.setAttribute("playsinline", "");
      video.style.width = "100%";
      video.style.marginTop = "10px";
      video.style.borderRadius = "10px";
      barcodeBox.prepend(video);
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" }
      }
    });

    video.srcObject = stream;
    await video.play();

    const detector = new BarcodeDetector({
      formats: [
        "ean_13",
        "ean_8",
        "upc_a",
        "upc_e",
        "code_128"
      ]
    });

    async function scanBarcode() {
      try {
        const barcodes = await detector.detect(video);

        if (barcodes.length > 0) {
          const code = barcodes[0].rawValue;

          barcodeInput.value = code;
          statusBox.textContent = "✅ Barcode found: " + code;

          stream.getTracks().forEach(track => track.stop());
          video.remove();

          return;
        }
      } catch (error) {
        console.error(error);
      }

      requestAnimationFrame(scanBarcode);
    }

    scanBarcode();

  } catch (error) {
    console.error(error);
    statusBox.textContent =
      "❌ Could not open barcode camera. You can enter the UPC manually.";
    barcodeInput.focus();
  }
});
let selectedImageDataUrl = null;

async function handlePhoto(file) {
  if (!file) return;

  statusBox.textContent = "Preparing photo...";
  resultsBox.style.display = "none";

  try {
  const previewUrl = URL.createObjectURL(file);
  preview.src = previewUrl;
  preview.style.display = "block";
  statusBox.textContent = "✅ Photo ready";

  selectedImageDataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = function(event) {
      resolve(event.target.result);
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  } catch (error) {
    console.error(error);
    statusBox.textContent = "❌ Could not read photo";
  }
}

cameraPhoto.addEventListener("change", function () {
  handlePhoto(cameraPhoto.files[0]);
});

libraryPhoto.addEventListener("change", function () {
  handlePhoto(libraryPhoto.files[0]);
});
barcodeSearchButton.addEventListener("click", async function () {
  const code = barcodeInput.value.trim();

  if (!code) {
    alert("Please scan or enter a barcode first.");
    return;
  }

  barcodeSearchButton.disabled = true;
  barcodeSearchButton.textContent = "Looking up...";
  statusBox.textContent = "🔎 Searching eBay for barcode...";
  resultsBox.style.display = "none";

  try {
    const response = await fetch(
      "/api/barcode/" + encodeURIComponent(code)
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Barcode lookup failed.");
    }

    const comps = data.comps || {};
    const listings = Array.isArray(comps.listings)
      ? comps.listings
      : [];

    const median = comps.median;

    const listingsHtml = listings.length
      ? listings.slice(0, 5).map((listing) => {
          const title = listing.title || "eBay listing";
          const image = listing.image || "";
          const price = listing.price || "";
          const url = listing.url || "";

          return `
            <div style="
              margin-top:12px;
              padding:12px;
              background:#f3f6f9;
              border-radius:8px;
            ">

              ${image ? `
                <img
                  src="${image}"
                  alt=""
                  style="
                    width:100%;
                    max-height:180px;
                    object-fit:contain;
                    border-radius:8px;
                    margin-bottom:10px;
                    background:white;
                  "
                >
              ` : ""}

              <div style="font-weight:700;margin-bottom:6px;">
                ${title}
              </div>

              ${price ? `
                <div style="
                  font-size:18px;
                  font-weight:700;
                  margin-bottom:8px;
                ">
                  $${Number(price).toFixed(2)}
                </div>
              ` : ""}

              ${url ? `
                <a
                  href="${url}"
                  target="_blank"
                  rel="noopener"
                  style="
                    display:block;
                    padding:10px;
                    background:#1677ff;
                    color:white;
                    text-decoration:none;
                    text-align:center;
                    border-radius:8px;
                    font-weight:700;
                  "
                >
                  View on eBay
                </a>
              ` : ""}

            </div>
          `;
        }).join("")
      : "<p>No matching eBay listings found.</p>";

    resultsBox.innerHTML = `
      <div>
        <h2>📦 Barcode Results</h2>

        <p>
          <strong>Barcode:</strong> ${code}
        </p>

        <p>
          <strong>Active listings found:</strong>
          ${listings.length}
        </p>

        <p>
          <strong>Median asking price:</strong>
          ${
            median != null
              ? "$" + Number(median).toFixed(2)
              : "Not available"
          }
        </p>

        ${listingsHtml}
      </div>
    `;

    resultsBox.style.display = "block";
    statusBox.textContent = "✅ Barcode lookup complete";

  } catch (error) {
    console.error(error);
    statusBox.textContent = "❌ Barcode lookup failed";
    resultsBox.textContent =
      error.message || "Something went wrong.";
    resultsBox.style.display = "block";

  } finally {
    barcodeSearchButton.disabled = false;
    barcodeSearchButton.textContent = "🔎 Look Up Barcode";
  }
});
analyzeButton.addEventListener("click", async function () {
  if (!selectedImageDataUrl) {
    alert("Please take or choose a photo first.");
    return;
  }

  analyzeButton.disabled = true;
  analyzeButton.textContent = "Scouting...";
  statusBox.textContent = "🔍 Analyzing for resale...";
  resultsBox.style.display = "none";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        imageDataUrl: selectedImageDataUrl
      })
    });

    const text = await response.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(text || "Server returned an invalid response.");
    }

    if (!response.ok) {
      throw new Error(data.error || "Analysis failed.");
    }

    statusBox.textContent = "✅ Analysis complete";
    resultsBox.innerHTML = formatResults(data);
    resultsBox.style.display = "block";

  } catch (error) {
    console.error(error);
    statusBox.textContent = "❌ Analysis failed";
    resultsBox.textContent = error.message || "Something went wrong.";
    resultsBox.style.display = "block";

  } finally {
    analyzeButton.disabled = false;
    analyzeButton.textContent = "Analyze for Resale";
  }
});

function formatResults(data) {
  const items = Array.isArray(data.items) ? data.items : [];

  return items.map((item) => {
    const name = item.name || "Unidentified item";
    const brand = item.brand || "Unknown";
    const resale = item.estimatedResale || "Not available";
    const maxBuy = item.maxBuyPrice || "Not available";
    const profit = item.estimatedProfit || "Not available";
    const confidence = item.confidence || "LOW";
    const recommendation = item.recommendation || "MAYBE";
    const reason = item.reason || "Insufficient information.";
    const ebaySearch = item.ebaySearch || item.searchQuery || name;

    const activeComps = item.activeComps || {};
    const marketAnalysis = item.marketAnalysis || {};
    const marketRecommendation = item.marketRecommendation || "";
    const marketMaxBuy = marketAnalysis.suggestedMaxBuy;
    const marketProfit = marketAnalysis.estimatedProfit;
    const listings = Array.isArray(activeComps.listings)
      ? activeComps.listings
      : [];
   const medianPrice = marketAnalysis.medianPrice ?? activeComps.median;
    const activeError = activeComps.error;

    const ebayUrl =
      "https://www.ebay.com/sch/i.html?_nkw=" +
      encodeURIComponent(ebaySearch);

    let symbol = "🟡";

    if (recommendation === "BUY") {
      symbol = "🟢";
    } else if (recommendation === "SKIP") {
      symbol = "🔴";
    }

    const marketBox = marketRecommendation ? `
      <div style="
        margin-top:18px;
        padding:16px;
        border-radius:14px;
        text-align:center;
        display:flex;
        flex-direction:column;
        gap:8px;
        background:${
          marketRecommendation === "BUY"
            ? "#dcfce7"
            : marketRecommendation === "SKIP"
            ? "#fee2e2"
            : "#fef3c7"
        };
      ">
        <div style="font-size:30px;font-weight:800;">
          ${
            marketRecommendation === "BUY"
              ? "🟢 BUY"
              : marketRecommendation === "SKIP"
              ? "🔴 SKIP"
              : "🟡 MAYBE"
          }
        </div>

        ${marketMaxBuy != null ? `
          <div style="font-size:22px;font-weight:700;">
            PAY NO MORE THAN $${Number(marketMaxBuy).toFixed(2)}
          </div>
        ` : ""}

        ${marketProfit != null ? `
          <div style="font-size:18px;">
            Expected profit: $${Number(marketProfit).toFixed(2)}
          </div>
        ` : ""}

        ${medianPrice != null ? `
          <div style="font-size:16px;">
           ${marketAnalysis.source === "SOLD"
  ? "Sold median:"
  : "eBay median:"} $${Number(medianPrice).toFixed(2)}
          </div>
        ` : ""}
      </div>
    ` : "";

    const compsHtml = listings.length ? `
      <div style="margin-top:20px;">
        <strong>
  ${marketAnalysis.source === "SOLD"
    ? "Comparable Sold eBay Items:"
    : "Comparable Active eBay Listings:"}
</strong>

        ${listings.slice(0, 5).map((listing) => {
          const title = listing.title || "eBay listing";
          const image = listing.image || "";

          const price =
            listing.price?.value ||
            listing.price ||
            "";

          const url =
            listing.url ||
            listing.itemWebUrl ||
            listing.itemHref ||
            "";

          return `
            <div style="
              margin-top:12px;
              padding:12px;
              background:#f3f6f9;
              border-radius:8px;
            ">
              ${image ? `
                <img
                  src="${image}"
                  alt=""
                  style="
                    width:100%;
                    max-height:180px;
                    object-fit:contain;
                    border-radius:8px;
                    margin-bottom:10px;
                    background:white;
                  "
                >
              ` : ""}

              <div style="font-weight:700;margin-bottom:6px;">
                ${title}
              </div>

              ${price ? `
                <div style="
                  font-size:18px;
                  font-weight:700;
                  margin-bottom:8px;
                ">
                  $${Number(price).toFixed(2)}
                </div>
              ` : ""}

              ${url ? `
                <a
                  href="${url}"
                  target="_blank"
                  rel="noopener"
                  style="
                    display:block;
                    padding:10px;
                    background:#1677ff;
                    color:white;
                    text-decoration:none;
                    text-align:center;
                    border-radius:8px;
                    font-weight:700;
                  "
                >
                  View on eBay
                </a>
              ` : ""}
            </div>
          `;
        }).join("")}
      </div>
    ` : "";

    const marketHtml = activeError
      ? `<p>Could not load eBay market data.</p>`
      : `
        <p>
          <strong>
${marketAnalysis.source === "SOLD"
  ? "Sold comps found:"
  : "Active listings found:"}
</strong>
${marketAnalysis.source === "SOLD"
  ? (item.soldComps?.count ?? item.soldComps?.comps?.length ?? 0)
  : listings.length}
        </p>

        <p>
        <strong>
  ${marketAnalysis.source === "SOLD"
    ? "Median sold price:"
    : "Median asking price:"}
</strong>
${
  medianPrice != null
    ? "$" + Number(medianPrice).toFixed(2)
    : "Not available"
}
        </p>
${marketAnalysis.sellThroughLabel ? `
  <div style="
    margin-top:14px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    background:#f7f7f7;
  ">
    <div style="font-size:22px;font-weight:800;">
      ${marketAnalysis.sellThroughLabel} SELLER
    </div>

    <div style="margin-top:6px;font-size:16px;">
      Sell-through: ${Number(marketAnalysis.sellThroughRate || 0).toFixed(1)}%
    </div>

    <div style="margin-top:4px;font-size:15px;">
      ${marketAnalysis.soldCount || 0} sold / ${marketAnalysis.activeCount || 0} active
    </div>
    <div style="
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #ddd;
  font-size:16px;
  font-weight:700;
">
  ${
    marketAnalysis.compConfidence === "HIGH"
      ? "🎯 HIGH CONFIDENCE"
      : marketAnalysis.compConfidence === "MEDIUM"
      ? "🟡 MEDIUM CONFIDENCE"
      : "⚠️ LOW CONFIDENCE"
  }
  <div style="
  margin-top:5px;
  font-size:14px;
  font-weight:500;
">
  Comp match: ${Number(marketAnalysis.averageMatchScore || 0).toFixed(1)}%
  <br>
Strong matches used for pricing: ${marketAnalysis.pricingCompCount || 0}
<br>
Typical sold range: $${Number(marketAnalysis.typicalLow || 0).toFixed(2)} - $${Number(marketAnalysis.typicalHigh || 0).toFixed(2)}
</div>
</div>
  </div>
` : ""}
        ${marketBox}
        ${compsHtml}
      `;

    return `
      <div style="margin-bottom:35px;">
        <h2>${name}</h2>

        <p><strong>Brand:</strong> ${brand}</p>
        <p><strong>Estimated resale:</strong> ${resale}</p>
        <p><strong>Maximum buy price:</strong> ${maxBuy}</p>
        <p><strong>Estimated profit:</strong> ${profit}</p>
        <p><strong>Confidence:</strong> ${confidence}</p>
        <p>
          <strong>Recommendation:</strong>
          ${symbol} ${recommendation}
        </p>
        <p><strong>Why:</strong> ${reason}</p>

        <div style="
          margin-top:20px;
          padding:16px;
          background:white;
          border-radius:10px;
        ">
          <h3 style="margin-top:0;">
  ${marketAnalysis.source === "SOLD"
    ? "📊 Sold eBay Market Data"
    : "📋 Active eBay Market Data"}
</h3>
          ${marketHtml}
        </div>

        <p>
          <a
            href="${ebayUrl}"
            target="_blank"
            rel="noopener"
            style="
              display:block;
              padding:14px;
              background:#1677ff;
              color:white;
              text-decoration:none;
              text-align:center;
              border-radius:10px;
              font-weight:bold;
            "
          >
            🔎 Search eBay
          </a>
          <br>

<a
  href="${ebayUrl}&LH_Sold=1&LH_Complete=1"
  target="_blank"
  rel="noopener"
  style="
    display:block;
    margin-top:10px;
    padding:14px;
    background:#198754;
    color:white;
    text-decoration:none;
    text-align:center;
    border-radius:10px;
    font-weight:bold;
  "
>
  📊 Research Sold on eBay
</a>
        </p>
      </div>
    `;
  }).join("");
}
</script>
</body>
</html>
