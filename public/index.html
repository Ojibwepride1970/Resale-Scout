<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resale Scout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .photoButton {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border-radius: 10px;
      background: #eeeeee;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #photo {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      margin-top: 20px;
      border-radius: 10px;
    }

    #analyzeButton {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #analyzeButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    #results {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #eef7ff;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔎 Resale Scout</h1>

  <div class="subtitle">
    Snap it. Scout it. Sell it.
  </div>

  <div class="card">

    <h2>Find items worth reselling</h2>

    <p>
      Take a picture of an item, thrift-store shelf, or garage-sale table
      and let Resale Scout analyze it for resale potential.
    </p>

    <label class="photoButton" for="cameraPhoto">
  📷 Take a Picture
</label>

<input
  id="cameraPhoto"
  type="file"
  accept="image/*"
  capture="environment"
  style="display:none"
>

<label class="photoButton" for="libraryPhoto">
  🖼️ Choose a Photo
</label>

<input
  id="libraryPhoto"
  type="file"
  accept="image/*"
  style="display:none"
>

    <img id="preview" alt="Selected photo">

    <button id="analyzeButton" type="button">
      Analyze for Resale
    </button>

    <div id="status"></div>

    <div id="results"></div>

  </div>

</div>

<script>
const cameraPhoto = document.getElementById("cameraPhoto");
const libraryPhoto = document.getElementById("libraryPhoto");
const preview = document.getElementById("preview");
const analyzeButton = document.getElementById("analyzeButton");
const statusBox = document.getElementById("status");
const resultsBox = document.getElementById("results");

let selectedImageDataUrl = null;

async function handlePhoto(file) {
  if (!file) return;

  statusBox.textContent = "Preparing photo...";
  resultsBox.style.display = "none";

  try {
    selectedImageDataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = function(event) {
        resolve(event.target.result);
      };

      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    preview.src = selectedImageDataUrl;
    preview.style.display = "block";

    statusBox.textContent = "✅ Photo ready";
  } catch (error) {
    console.error(error);
    statusBox.textContent = "❌ Could not read photo";
  }
}

cameraPhoto.addEventListener("change", function () {
  handlePhoto(cameraPhoto.files[0]);
});

libraryPhoto.addEventListener("change", function () {
  handlePhoto(libraryPhoto.files[0]);
});

analyzeButton.addEventListener("click", async function () {
  if (!selectedImageDataUrl) {
    alert("Please take or choose a photo first.");
    return;
  }

  analyzeButton.disabled = true;
  analyzeButton.textContent = "Scouting...";
  statusBox.textContent = "🔍 Analyzing for resale...";
  resultsBox.style.display = "none";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        imageDataUrl: selectedImageDataUrl
      })
    });

    const text = await response.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(text || "Server returned an invalid response.");
    }

    if (!response.ok) {
      throw new Error(data.error || "Analysis failed.");
    }

    statusBox.textContent = "✅ Analysis complete";

    resultsBox.innerHTML = formatResults(data);
    resultsBox.style.display = "block";

  } catch (error) {
    console.error(error);
    statusBox.textContent = "❌ Analysis failed";
    resultsBox.textContent = error.message || "Something went wrong.";
    resultsBox.style.display = "block";

  } finally {
    analyzeButton.disabled = false;
    analyzeButton.textContent = "Analyze for Resale";
  }
});

  

function resizeImage(file) {
  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onerror = reject;

    reader.onload = function (event) {

      const img = new Image();

      img.onerror = reject;

      img.onload = function () {

        const maxSize = 1600;

        let width = img.width;
        let height = img.height;

        if (width > height && width > maxSize) {
          height = Math.round(height * maxSize / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img, 0, 0, width, height);

        const resizedDataUrl =
          canvas.toDataURL("image/jpeg", 0.82);

        resolve(resizedDataUrl);
      };

      img.src = event.target.result;
    };

    reader.readAsDataURL(file);
  });
}function formatResults(data) {
  const items = Array.isArray(data.items) ? data.items : [data];

  return items.map((item, index) => {
    const name =
      item.name ||
      item.title ||
      item.identification ||
      `Item ${index + 1}`;

    const brand = item.brand || "Unknown";
    const model = item.model || "";
    const condition = item.condition || "";
    const value =
      item.estimatedValue ||
      item.resaleValue ||
      item.estimatedResaleValue ||
      "";

    const buyPrice =
      item.maxBuyPrice ||
      item.buyPrice ||
      item.maximumBuyPrice ||
      "";

    const recommendation =
      item.recommendation ||
      item.decision ||
      item.buyOrPass ||
      "";

    const reason =
      item.reason ||
      item.notes ||
      item.explanation ||
      "";

    const searchQuery =
      item.searchQuery ||
      item.ebaySearch ||
      "";

    let html = `
      <div style="margin-bottom:24px;">
        <h2>${name}</h2>
    `;

    if (brand && brand !== "Unknown") {
      html += `<p><strong>Brand:</strong> ${brand}</p>`;
    }

    if (model) {
      html += `<p><strong>Model:</strong> ${model}</p>`;
    }

    if (condition) {
      html += `<p><strong>Condition:</strong> ${condition}</p>`;
    }

    if (value) {
      html += `<p><strong>Estimated resale value:</strong> ${value}</p>`;
    }

    if (buyPrice) {
      html += `<p><strong>Maximum buy price:</strong> ${buyPrice}</p>`;
    }

    if (recommendation) {
      html += `<p><strong>Recommendation:</strong> ${recommendation}</p>`;
    }

    if (reason) {
      html += `<p><strong>Why:</strong> ${reason}</p>`;
    }

    if (searchQuery) {
      html += `<p><strong>eBay search:</strong> ${searchQuery}</p>`;
    }

    html += `</div>`;

    return html;
  }).join("");
}
</script>

</body>
</html>
